<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1a1a"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <style>
      text { font-family: 'Helvetica Neue', Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- header -->
  <g transform="translate(80,90)">
    <!-- rewind icon -->
    <g transform="translate(0,-18)" fill="#1ed760">
      <path d="M30 0 L8 18 L30 36 Z"/>
      <path d="M56 0 L34 18 L56 36 Z"/>
    </g>
    <text x="78" y="14" fill="#ffffff" font-size="58" font-weight="800">Playlist Undo</text>
  </g>
  <text x="80" y="190" fill="#b3b3b3" font-size="30" font-weight="500">Restore tracks you removed from your playlists.</text>

  <!-- modal card -->
  <g transform="translate(80,240)">
    <rect width="1120" height="320" rx="18" fill="#181818" stroke="#2a2a2a" stroke-width="2"/>

    <!-- row template -->
    <g font-family="Helvetica Neue, Arial, sans-serif">
      <!-- row 1 -->
      <g transform="translate(40,40)">
        <text x="0" y="24" fill="#ffffff" font-size="26" font-weight="700">Midnight City</text>
        <text x="0" y="54" fill="#8a8a8a" font-size="19">M83 · Late Night Drive · 2m ago</text>
        <rect x="820" y="6" width="150" height="48" rx="24" fill="#1ed760"/>
        <text x="895" y="38" fill="#000000" font-size="21" font-weight="800" text-anchor="middle">Restore</text>
        <text x="1010" y="40" fill="#6a6a6a" font-size="26" text-anchor="middle">✕</text>
      </g>
      <!-- row 2 -->
      <g transform="translate(40,130)">
        <text x="0" y="24" fill="#ffffff" font-size="26" font-weight="700">Redbone</text>
        <text x="0" y="54" fill="#8a8a8a" font-size="19">Childish Gambino · chill · 1h ago</text>
        <rect x="820" y="6" width="150" height="48" rx="24" fill="#1ed760"/>
        <text x="895" y="38" fill="#000000" font-size="21" font-weight="800" text-anchor="middle">Restore</text>
        <text x="1010" y="40" fill="#6a6a6a" font-size="26" text-anchor="middle">✕</text>
      </g>
      <!-- row 3 -->
      <g transform="translate(40,220)">
        <text x="0" y="24" fill="#ffffff" font-size="26" font-weight="700">The Less I Know The Better</text>
        <text x="0" y="54" fill="#8a8a8a" font-size="19">Tame Impala · gym · 3d ago</text>
        <rect x="820" y="6" width="150" height="48" rx="24" fill="#1ed760"/>
        <text x="895" y="38" fill="#000000" font-size="21" font-weight="800" text-anchor="middle">Restore</text>
        <text x="1010" y="40" fill="#6a6a6a" font-size="26" text-anchor="middle">✕</text>
      </g>
    </g>
  </g>
</svg>
